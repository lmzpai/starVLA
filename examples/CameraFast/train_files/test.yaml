run_id: CameraFast-Libero-4B
run_root_dir: checkpoints/CameraFast-Libero-4B
seed: 42
trackers: [jsonl]
wandb_entity: lmz666pai-peking-university
wandb_project: starvla_ap_0318
is_debug: false

framework:
  name: CameraFast
  qwenvl:
    base_vlm: /share/project/zhouenshen/hpfs/ckpt/vlm/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_dim: 14
    state_dim: 14
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    tokenizer: /share/project/zhouenshen/hpfs/ckpt/vla/fast


datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: asv2_conversation_en,asv2_detailed_description_en,coco_karpathy_train_567_en,okvqa_en,vqav2_en
    eval_dataset: aokvqa_cauldron_llava_format
    data_flatten: false
    base_interval: 2
    max_pixels: 12845056
    min_pixels: 784
    model_max_length: 65536
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /share/project/zhouenshen/hpfs/code/starVLA/playground/dataset/RoboTwin/RoboTwin_lerobot/Clean
    data_mix: robotwin # bridge_rt_1
    action_type: abs_qpos
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224,224]
    video_backend: torchvision_av
    preserve_image_size: false # true
    camera_action_prompt: "<think>I don't need to rotate the camera as the desired object is clearly visible and centered in the image.</think><answer>rotate(0,0)</answer>."
    # Optional: override Qwen processor pixel limits for high-res inputs.
    # (If not set here, it falls back to datasets.vlm_data.max_pixels/min_pixels.)
    # max_pixels: 12845056
    # min_pixels: 784
    

trainer:
  epochs: 100
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 5000
  save_interval_epochs: 1
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: true
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true